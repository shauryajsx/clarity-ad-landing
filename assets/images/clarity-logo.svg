<svg width="160" height="50" viewBox="0 0 160 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clarityOvalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4B88"/>
      <stop offset="50%" stop-color="#183B6C"/>
      <stop offset="100%" stop-color="#102A50"/>
    </linearGradient>
    <linearGradient id="ovalBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B93D3"/>
      <stop offset="100%" stop-color="#2D5C9A"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Oval Badge -->
  <ellipse cx="80" cy="25" rx="76" ry="22" fill="url(#clarityOvalGrad)" stroke="url(#ovalBorderGrad)" stroke-width="2.5"/>
  <ellipse cx="80" cy="25" rx="70" ry="18" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  
  <!-- Clarity Text -->
  <text x="80" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5" text-anchor="middle">Clarity</text>
</svg>
